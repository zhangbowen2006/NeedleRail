name: check-build-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Versions and format
        run: |
          moon version --all
          moon fmt --check
      - name: Check build and test
        run: |
          moon check --target all --deny-warn
          moon build --target all --deny-warn
          moon test --target all --deny-warn
          moon run cmd/main
          moon info
          git diff --exit-code -- '*.mbti'
      - name: CLI and artifact regression
        run: |
          moon build --target js --release --deny-warn
          node --test tests/*.test.mjs
          for item in outline satin patch; do node scripts/cli.mjs examples/$item.json _build/ci/$item; done
      - name: Independent DST and SVG verification
        run: |
          python -m pip install pyembroidery==1.5.1
          python scripts/verify_dst.py --directory _build/ci
